<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="steel">
      <stop offset="0" stop-color="#eceff1"/>
      <stop offset="0.5" stop-color="#90a4ae"/>
      <stop offset="1" stop-color="#455a64"/>
    </linearGradient>
    <linearGradient id="steel-v" xlink:href="#steel" x1="0" y1="0" x2="0" y2="1"/>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" gradientTransform="rotate(30 0.5 0.5)">
      <stop offset="0%" stop-color="#fff59d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbc02d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect data-mat-uid="el_grad_tank" x="10" y="10" width="80" height="80" fill="url(#steel)"/>
  <rect data-mat-uid="el_grad_pipe" x="100" y="40" width="90" height="20" fill="url(#steel-v) #90a4ae"/>
  <circle data-mat-uid="el_grad_lamp" cx="150" cy="20" r="15" fill="url(#glow)"/>
</svg>
