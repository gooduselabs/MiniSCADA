<?xml version="1.0" encoding="UTF-8"?>
<!-- MÔ PHỎNG: ký hiệu bơm vẽ tay (dự án tự viết, CC0) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- thân bơm -->
  <g id="pump" data-mat-uid="el_pump_group" data-mat-name="Bơm">
    <circle id="pump-body" data-mat-uid="el_pump_body" cx="60" cy="60" r="40" fill="#cfd8dc" stroke="#37474f" stroke-width="3"/>
    <polygon id="pump-arrow" data-mat-uid="el_pump_arrow" points="45,40 85,60 45,80" fill="#37474f"/>
    <line data-mat-uid="el_pump_inlet" x1="0" y1="60" x2="20" y2="60" stroke="#37474f" stroke-width="6"/>
    <line data-mat-uid="el_pump_outlet" x1="100" y1="60" x2="120" y2="60" stroke="#37474f" stroke-width="6"/>
  </g>
</svg>
