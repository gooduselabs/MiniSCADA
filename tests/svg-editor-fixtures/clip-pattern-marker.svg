<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <clipPath id="window" clipPathUnits="userSpaceOnUse">
      <rect x="20" y="20" width="60" height="60" rx="10"/>
    </clipPath>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#9e9e9e"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#000"/>
    </marker>
  </defs>
  <rect data-mat-uid="el_clipped" x="0" y="0" width="100" height="100" fill="url(#hatch)" clip-path="url(#window)"/>
  <line data-mat-uid="el_flow_arrow" x1="110" y1="60" x2="190" y2="60" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
