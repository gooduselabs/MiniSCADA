# Rig of the BACnet/IP driver integration tests (feature 020), started by tools/driver-it-bacnet.ps1:
# the x64 runtime under the supervision loop of tests/device-it (supervise.sh), the BACnet/IP device
# simulator of tools/bacnet-sim, and a Node client that runs the scenarios
# (tests/driver-it-bacnet/bacnet-it.mjs). Its own compose project name (mat-bacnet-it) and network
# (172.30.20.0/24), so it runs beside the Modbus rig (tests/driver-it, 172.30.6.0/24) and the rigs
# of the other drivers (172.30.16-18.0/24).
#
# lan 172.30.20.0/24: rt .10, sim .20, client .50
name: mat-bacnet-it

services:
  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /src/tools/bacnet-sim/sim.mjs
      - --port
      - "47808"
      - --control
      - "8090"
      - --control-host
      - 0.0.0.0
      - --broadcast
      - 172.30.20.255
      - --map
      - ${MAT_IT_MAP:-/src/tools/bacnet-sim/maps/all-types.json}
    init: true
    volumes:
      - ../..:/src:ro
    networks:
      lan: { ipv4_address: 172.30.20.20 }

  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ["sh", "/src/tests/device-it/supervise.sh", "--no-sim-load", "--no-discovery", "--max-live-clients-per-source", "10"]
    environment:
      MAT_IT_PROJECT: ${MAT_IT_PROJECT:-/src/tests/driver-it-bacnet/projects/read-all-bacnet}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - rt-data:/data
    stop_grace_period: 5s
    depends_on: [sim]
    networks:
      lan: { ipv4_address: 172.30.20.10 }

  client:
    image: node:22.23.3-alpine
    command: ["sleep", "infinity"]
    init: true
    pid: "service:rt"
    volumes:
      - ../..:/src:ro
    networks:
      lan: { ipv4_address: 172.30.20.50 }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  rt-data:
