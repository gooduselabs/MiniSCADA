# Rig of the OPC UA driver integration tests (feature 019 T021), started by tools/driver-it-opcua.ps1:
# the x64 runtime under the supervision loop of tests/device-it (supervise.sh), the OPC UA test
# server mat-opcua-sim (tools/opcua-sim, open62541) and a Node client that runs the scenarios
# (tests/driver-it-opcua/opcua-it.mjs). Its own compose project name (mat-opcua-it) and network
# (172.30.19.0/24), so it runs beside the Modbus rig and the rigs of the other drivers (16-18).
#
# lan 172.30.19.0/24: rt .10, sim .20, client .50
name: mat-opcua-it

services:
  sim:
    image: mat-armhf
    command: ["sh", "-c", "exec /build/x64/bin/mat-opcua-sim --port 4840 --cert-dir /simcerts --change-ms 1000 ${MAT_IT_SIM_ARGS:-}"]
    init: true
    hostname: sim
    volumes:
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - sim-certs:/simcerts
    stop_grace_period: 3s
    networks:
      lan: { ipv4_address: 172.30.19.20 }

  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ["sh", "/src/tests/device-it/supervise.sh", "--no-sim-load", "--no-discovery", "--max-live-clients-per-source", "10"]
    environment:
      MAT_IT_PROJECT: ${MAT_IT_PROJECT:-/src/tests/driver-it-opcua/projects/read-all-types-opcua}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - rt-data:/data
    stop_grace_period: 5s
    depends_on: [sim]
    networks:
      lan: { ipv4_address: 172.30.19.10 }

  client:
    image: node:22.23.3-alpine
    command: ["sleep", "infinity"]
    init: true
    pid: "service:rt"
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
    networks:
      lan: { ipv4_address: 172.30.19.50 }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.19.0/24

volumes:
  rt-data:
  sim-certs:
