<?xml version="1.0" encoding="UTF-8"?>
<!-- Màn hình mẫu Sprint 1 (viết tay). Phần tử có binding mang data-mat-uid (ADR-003). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <title>Bồn nước + bơm</title>
  <defs>
    <clipPath id="tank-clip">
      <rect x="200" y="150" width="280" height="420" rx="26"/>
    </clipPath>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="40" y="64" fill="#e2e8f0" font-size="30" font-weight="600">Trạm bơm nước — TANK01 / MOTOR01</text>
  <text x="40" y="96" fill="#94a3b8" font-size="16">Dữ liệu mô phỏng (Mock Tag) · Sprint 1</text>

  <!-- Ống: bơm → đỉnh bồn -->
  <path d="M 900 520 H 1010 V 110 H 340 V 150" fill="none" stroke="url(#steel)" stroke-width="22" stroke-linejoin="round"/>
  <path d="M 780 600 H 640 V 520 H 820" fill="none" stroke="url(#steel)" stroke-width="22" stroke-linejoin="round"/>
  <path d="M 480 540 H 640" fill="none" stroke="url(#steel)" stroke-width="22"/>

  <!-- Bồn -->
  <rect x="200" y="150" width="280" height="420" rx="26" fill="#1e293b"/>
  <g clip-path="url(#tank-clip)">
    <rect data-mat-uid="el_tank_level" x="200" y="150" width="280" height="420" fill="url(#water)"/>
  </g>
  <rect data-mat-uid="el_tank_body" x="200" y="150" width="280" height="420" rx="26" fill="none" stroke="#64748b" stroke-width="8"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="480" y1="192" x2="500" y2="192"/>
    <line x1="480" y1="276" x2="500" y2="276"/>
    <line x1="480" y1="360" x2="500" y2="360"/>
    <line x1="480" y1="444" x2="500" y2="444"/>
    <line x1="480" y1="528" x2="500" y2="528"/>
  </g>
  <g fill="#94a3b8" font-size="14">
    <text x="508" y="197">90%</text>
    <text x="508" y="281">70%</text>
    <text x="508" y="365">50%</text>
    <text x="508" y="449">30%</text>
    <text x="508" y="533">10%</text>
  </g>
  <text x="340" y="610" fill="#e2e8f0" font-size="20" text-anchor="middle">TANK01</text>
  <text data-mat-uid="el_txt_level" x="340" y="370" fill="#f8fafc" font-size="44" font-weight="700" text-anchor="middle">--</text>

  <!-- Bơm / motor -->
  <rect data-mat-uid="el_motor_body" x="780" y="450" width="140" height="150" rx="18" fill="#64748b" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="850" cy="525" r="54" fill="#0f172a" stroke="#cbd5e1" stroke-width="4"/>
  <g data-mat-uid="el_motor_fan">
    <circle cx="850" cy="525" r="48" fill="none"/>
    <path d="M 850 525 L 850 481 A 14 14 0 0 1 864 495 Z" fill="#e2e8f0"/>
    <path d="M 850 525 L 888 547 A 14 14 0 0 1 869 554 Z" fill="#e2e8f0"/>
    <path d="M 850 525 L 812 547 A 14 14 0 0 1 812 527 Z" fill="#e2e8f0"/>
    <circle cx="850" cy="525" r="10" fill="#94a3b8"/>
  </g>
  <circle data-mat-uid="el_motor_lamp" cx="900" cy="430" r="14" fill="#64748b" stroke="#0f172a" stroke-width="3"/>
  <text x="850" y="640" fill="#e2e8f0" font-size="20" text-anchor="middle">MOTOR01</text>

  <!-- Bảng giá trị -->
  <rect x="1060" y="200" width="190" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="1080" y="236" fill="#94a3b8" font-size="15">Tốc độ (rpm)</text>
  <text data-mat-uid="el_txt_speed" x="1080" y="270" fill="#f8fafc" font-size="28" font-weight="600">--</text>
  <text x="1080" y="320" fill="#94a3b8" font-size="15">Nhiệt độ nước</text>
  <text data-mat-uid="el_txt_temp" x="1080" y="354" fill="#f8fafc" font-size="28" font-weight="600">--</text>
  <text x="1080" y="404" fill="#94a3b8" font-size="13">Xám = chất lượng xấu</text>
</svg>
