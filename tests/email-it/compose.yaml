# Rig tích hợp x64 của feature 023 (email alarm), chạy bởi tools/email-it.ps1: runtime x64 dưới supervise.sh, giả lập
# Modbus dùng chung mạng của rt (project it-basic của feature 009), máy chủ SMTP giả (tools/email-it/fake-smtp.mjs) có
# STARTTLS bằng chứng chỉ thử sinh mỗi lần chạy (thư mục MAT_IT_CERTS, gắn vào cả rt làm caFile). Cổng và mạng riêng để
# chạy cạnh các rig khác. Mật khẩu thử sinh ngẫu nhiên mỗi lần chạy.
name: mat-email-it

services:
  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ['sh', '/src/tests/device-it/supervise.sh', '--no-discovery']
    environment:
      MAT_IT_PROJECT: /src/tests/alarm-it/projects/it-basic
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - ${MAT_IT_CERTS:?MAT_IT_CERTS}:/certs:ro
      - rt-data:/data
      - rt-etc:/etc/mat-runtime
    ports:
      - '127.0.0.1:29080:8080'
      - '127.0.0.1:29443:8443'
      - '127.0.0.1:29503:1503'
    stop_grace_period: 5s
    networks:
      lan: { ipv4_address: 172.30.23.10 }

  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /src/tools/modbus-sim/sim.mjs
      - --tcp
      - '1502'
      - --control
      - '1503'
      - --control-host
      - 0.0.0.0
      - --map
      - /src/tests/alarm-it/map.json
    init: true
    network_mode: 'service:rt'
    volumes:
      - ../..:/src:ro
    depends_on: [rt]

  smtp:
    image: node:22.23.3-alpine
    hostname: smtp
    command: ['node', '/src/tools/email-it/fake-smtp.mjs', '--port', '2525', '--control', '2580', '--user', 'mat']
    init: true
    environment:
      MAT_IT_SMTP_PW: ${MAT_IT_SMTP_PW:?MAT_IT_SMTP_PW}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_CERTS:?MAT_IT_CERTS}:/certs:ro
    ports:
      - '127.0.0.1:29580:2580'
    networks:
      lan: { ipv4_address: 172.30.23.20 }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.23.0/24

volumes:
  rt-data:
  rt-etc:
