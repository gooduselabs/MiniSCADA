<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 360" width="640" height="360">
  <title>Sơ đồ công nghệ tổng hợp</title>
  <defs>
    <linearGradient id="po-shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aab4bd" />
      <stop offset="0.5" stop-color="#eef2f5" />
      <stop offset="1" stop-color="#8a959f" />
    </linearGradient>
    <clipPath id="po-tank-clip"><rect x="60" y="80" width="100" height="160" rx="10" /></clipPath>
    <g id="po-valve">
      <polygon points="0,-14 20,0 0,14" />
      <polygon points="40,-14 20,0 40,14" />
    </g>
  </defs>
  <rect width="640" height="360" fill="#f4f6f8" />
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">Dây chuyền bơm – bồn – van</text>
  <polyline points="160,220 260,220" stroke="#59646e" stroke-width="16" fill="none" />
  <polyline points="300,220 560,220 560,120" stroke="#59646e" stroke-width="16" fill="none" />
  <polyline points="160,220 260,220" stroke="#2f8fdc" stroke-width="9" fill="none" />
  <polyline points="300,220 560,220 560,120" stroke="#2f8fdc" stroke-width="9" fill="none" />
  <rect x="50" y="70" width="120" height="180" rx="14" fill="url(#po-shell)" stroke="#59646e" stroke-width="3" />
  <g clip-path="url(#po-tank-clip)">
    <rect x="60" y="80" width="100" height="160" fill="#1c2630" />
    <rect id="po-level" data-tag="SIM.T0011" x="60" y="170" width="100" height="70" fill="#2f8fdc" />
  </g>
  <g transform="translate(260 205)" fill="#3aa655" stroke="#1f5e30" stroke-width="2">
    <use id="po-valve-1" data-tag="SIM.T0012" xlink:href="#po-valve" />
  </g>
  <circle id="po-motor" data-tag="SIM.T0013" cx="420" cy="220" r="26" fill="#3aa655" stroke="#222" stroke-width="3" />
  <text x="420" y="226" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff">M</text>
  <rect x="520" y="70" width="80" height="50" rx="8" fill="#e8edf1" stroke="#59646e" stroke-width="3" />
  <text id="po-readout" data-tag="SIM.T0014" x="560" y="103" text-anchor="middle" font-family="monospace" font-size="20" fill="#222">--.-</text>
  <text x="110" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222">TK-101</text>
  <text x="295" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222">XV-301</text>
  <text x="420" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#222">P-401</text>
