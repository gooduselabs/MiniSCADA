<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 200" width="360" height="200">
  <title>Gradient và pattern</title>
  <defs>
    <linearGradient id="g-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f77b4" />
      <stop offset="1" stop-color="#9ecae1" />
    </linearGradient>
    <linearGradient id="g-inherit" xlink:href="#g-base" gradientTransform="rotate(90 0.5 0.5)" />
    <radialGradient id="g-radial" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#7fd18b" />
      <stop offset="1" stop-color="#1f6b32" />
    </radialGradient>
    <linearGradient id="g-user" gradientUnits="userSpaceOnUse" x1="250" y1="20" x2="340" y2="180">
      <stop offset="0" stop-color="#f2994a" />
      <stop offset="0.5" stop-color="#eb5757" />
      <stop offset="1" stop-color="#6a1b9a" />
    </linearGradient>
    <pattern id="p-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f4f6f8" />
      <line x1="0" y1="0" x2="0" y2="10" stroke="#59646e" stroke-width="3" />
    </pattern>
  </defs>
  <rect x="10" y="10" width="100" height="80" rx="6" fill="url(#g-base)" />
  <rect x="10" y="110" width="100" height="80" rx="6" fill="url(#g-inherit)" />
  <circle cx="175" cy="60" r="45" fill="url(#g-radial)" />
  <rect id="pattern-target" data-tag="SIM.T0008" x="130" y="115" width="100" height="75" rx="6" fill="url(#p-hatch)" stroke="#59646e" stroke-width="2" />
  <ellipse cx="295" cy="100" rx="55" ry="80" fill="url(#g-user)" />
</svg>
