<?xml version="1.0" encoding="UTF-8"?>
<!-- MÔ PHỎNG (viết tay) đặc trưng Adobe Illustrator "Export As → SVG" kiểu mới (Styling: Internal CSS). KHÔNG phải file xuất thật. -->
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300">
  <defs>
    <style>
      .cls-1{fill:url(#linear-gradient);}
      .cls-2{fill:#2f8fdc;}
      .cls-3{fill:#3aa655;stroke:#1f5e30;stroke-miterlimit:10;stroke-width:3px;}
      .cls-4{font-size:16px;font-family:ArialMT, Arial;}
    </style>
    <linearGradient id="linear-gradient" x1="40" y1="160" x2="200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#aab4bd"/>
      <stop offset="0.5" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#8a959f"/>
    </linearGradient>
    <symbol id="New_Symbol" data-name="New Symbol" viewBox="0 0 20 20">
      <circle class="cls-3" cx="10" cy="10" r="8"/>
    </symbol>
  </defs>
  <title>Illustrator Export As (mô phỏng)</title>
  <rect class="cls-1" x="40" y="50" width="160" height="210"/>
  <rect id="level" data-tag="SIM.T0022" class="cls-2" x="52" y="150" width="136" height="100"/>
  <polygon class="cls-3" points="250 120 290 150 250 180 250 120"/>
  <polygon class="cls-3" points="330 120 290 150 330 180 330 120"/>
  <use width="20" height="20" transform="translate(280 40) scale(1.5)" xlink:href="#New_Symbol"/>
  <text class="cls-4" transform="translate(95 287)">TK-101</text>
</svg>
