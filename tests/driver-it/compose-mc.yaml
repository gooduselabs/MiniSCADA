# Rig of the MC protocol (SLMP) integration tests of feature 017 (specs/017-driver-mc T032), started
# by tools/driver-it-mc.ps1: the x64 runtime under the same supervision loop as tests/device-it
# (supervise.sh), the MC simulator of tools/mc-sim (TCP and UDP on 5007, control API on 5009), and a
# Node client that runs the scenarios (tests/driver-it/mc-it.mjs) on the same network.
#
# lan 172.30.17.0/24:  rt .10, sim .20, client .50
# The runtime reads the project of MAT_IT_PROJECT (a folder of tests/driver-it/projects), the
# simulator the map of MAT_IT_MAP (tools/mc-sim/maps). The client shares the PID namespace of rt to
# measure its CPU and memory. Test accounts are made by tools/driver-it-mc.ps1 with
# --password-stdin; nothing secret is written in the repository.
name: mat-mc-it

services:
  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /src/tools/mc-sim/sim.mjs
      - --tcp
      - "5007"
      - --udp
      - "5007"
      - --control
      - "5009"
      - --control-host
      - 0.0.0.0
      - --map
      - ${MAT_IT_MAP:-/src/tools/mc-sim/maps/it-all-types.json}
      - --log
      - /logs/requests.jsonl
    init: true
    volumes:
      - ../..:/src:ro
      - sim-logs:/logs
    networks:
      lan: { ipv4_address: 172.30.17.20 }

  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ["sh", "/src/tests/device-it/supervise.sh", "--no-sim-load", "--no-discovery", "--max-live-clients-per-source", "10"]
    environment:
      MAT_IT_PROJECT: ${MAT_IT_PROJECT:-/src/tests/driver-it/projects/mc-all-types}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - rt-data:/data
    stop_grace_period: 5s
    depends_on: [sim]
    networks:
      lan: { ipv4_address: 172.30.17.10 }

  client:
    image: node:22.23.3-alpine
    command: ["sleep", "infinity"]
    init: true
    pid: "service:rt"
    cap_add: [SYS_PTRACE]
    volumes:
      - ../..:/src:ro
      - sim-logs:/sim-logs:ro
    networks:
      lan: { ipv4_address: 172.30.17.50 }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.17.0/24

volumes:
  rt-data:
  sim-logs:
