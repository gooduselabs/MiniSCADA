# Rig of the driver integration tests of feature 006 (specs/006-tags-modbus T074, T110, T148;
# quickstart §3), started by tools/driver-it.ps1: the x64 runtime under the same supervision loop
# as tests/device-it (supervise.sh), the Modbus TCP simulator of tools/modbus-sim, and a Node
# client that runs the scenarios (tests/driver-it/driver-it.mjs) on the same network.
#
# lan 172.30.6.0/24:  rt .10, sim .20, client .50
# The runtime reads the project of MAT_IT_PROJECT (a folder of tests/driver-it/projects), the
# simulator the map of MAT_IT_MAP (tools/modbus-sim/maps). The client shares the PID namespace of
# rt to measure its CPU and memory and to kill it (write-kill). Test accounts are made by
# tools/driver-it.ps1 with --password-stdin; nothing secret is written in the repository.
name: mat-drv-it

services:
  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /src/tools/modbus-sim/sim.mjs
      - --tcp
      - "1502"
      - --control
      - "1503"
      - --control-host
      - 0.0.0.0
      - --map
      - ${MAT_IT_MAP:-/src/tools/modbus-sim/maps/all-types.json}
      - --log
      - /logs/requests.jsonl
    init: true
    volumes:
      - ../..:/src:ro
      - sim-logs:/logs
    networks:
      lan: { ipv4_address: 172.30.6.20 }

  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ["sh", "/src/tests/device-it/supervise.sh", "--no-sim-load", "--no-discovery"]
    environment:
      MAT_IT_PROJECT: ${MAT_IT_PROJECT:-/src/tests/driver-it/projects/read-all-types}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - rt-data:/data
    stop_grace_period: 5s
    depends_on: [sim]
    networks:
      lan: { ipv4_address: 172.30.6.10 }

  client:
    image: node:22.23.3-alpine
    command: ["sleep", "infinity"]
    init: true
    pid: "service:rt"
    volumes:
      - ../..:/src:ro
      - rt-data:/rt-data
      - sim-logs:/sim-logs:ro
    networks:
      lan: { ipv4_address: 172.30.6.50 }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.6.0/24

volumes:
  rt-data:
  sim-logs:
