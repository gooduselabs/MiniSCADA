# Rig tích hợp x64 của feature 007 (specs/007-screens-widgets T049, T073, quickstart §3), chạy bởi tools/web-it.ps1:
# runtime x64 dưới vòng giám sát của tests/device-it (supervise.sh), giả lập Modbus TCP dùng CHUNG mạng của rt
# (project dashboard-demo trỏ 127.0.0.1:1502), và một client Node chạy các kịch bản giao thức
# (tests/web-it/web-it.mjs). Chrome (puppeteer-core) chạy trên máy dev, vào rt qua cổng loopback 18443/18080.
#
# lan 172.30.7.0/24: rt .10, client .50
# pub 203.0.113.0/24: rt .10, client .50 (nguồn IP thứ hai của client: ca A23, đổi IP)
# Mật khẩu thử do tools/web-it.ps1 sinh ngẫu nhiên (--password-stdin); không có gì bí mật trong repo.
name: mat-web-it

services:
  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ['sh', '/src/tests/device-it/supervise.sh', '--no-discovery']
    environment:
      MAT_IT_PROJECT: ${MAT_IT_PROJECT:-/src/projects/dashboard-demo}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - rt-data:/data
      - rt-etc:/etc/mat-runtime
    ports:
      - '127.0.0.1:18080:8080'
      - '127.0.0.1:18443:8443'
    stop_grace_period: 5s
    networks:
      lan: { ipv4_address: 172.30.7.10 }
      pub: { ipv4_address: 203.0.113.10 }

  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /src/tools/modbus-sim/sim.mjs
      - --tcp
      - '1502'
      - --control
      - '1503'
      - --control-host
      - 0.0.0.0
      - --map
      - ${MAT_IT_MAP:-/src/tools/modbus-sim/maps/modbus-demo.json}
      - --log
      - /logs/requests.jsonl
    init: true
    network_mode: 'service:rt'
    volumes:
      - ../..:/src:ro
      - sim-logs:/logs
    depends_on: [rt]

  client:
    image: node:22.23.3-alpine
    command: ['sleep', 'infinity']
    init: true
    pid: 'service:rt'
    volumes:
      - ../..:/src:ro
      - rt-data:/rt-data
    networks:
      lan: { ipv4_address: 172.30.7.50 }
      pub: { ipv4_address: 203.0.113.50 }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.7.0/24
  pub:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24

volumes:
  rt-data:
  rt-etc:
  sim-logs:
