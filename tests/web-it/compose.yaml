# Rig tích hợp x64 của feature 007 (specs/007-screens-widgets T049, T073, quickstart §3), chạy bởi tools/web-it.ps1:
# runtime x64 dưới vòng giám sát của tests/device-it (supervise.sh), giả lập Modbus TCP dùng CHUNG mạng của rt
# (project dashboard-demo trỏ 127.0.0.1:1502), và một client Node chạy các kịch bản giao thức
# (tests/web-it/web-it.mjs). Chrome (puppeteer-core) chạy trên máy dev, vào rt qua cổng loopback 18443/18080.
#
# lan 172.30.7.0/24: rt .10, client .50
# pub 203.0.113.0/24: rt .10, client .50 (nguồn IP thứ hai của client: ca A23, đổi IP)
# Chạy song song rig khác (feature 008): MAT_IT_LAN, MAT_IT_PUB (ba octet đầu), MAT_IT_*_PORT và -p <tên>
# (tools/web-it.ps1 -Isolated). Cổng 1503 của giả lập mở ra loopback (MAT_IT_SIM_PORT) cho các kịch bản Chrome.
# Mật khẩu thử do tools/web-it.ps1 sinh ngẫu nhiên (--password-stdin); không có gì bí mật trong repo.
name: mat-web-it

services:
  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ['sh', '/src/tests/device-it/supervise.sh', '--no-discovery', '--max-live-clients-per-source', '10']
    environment:
      MAT_IT_PROJECT: ${MAT_IT_PROJECT:-/src/projects/dashboard-demo}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - rt-data:/data
      - rt-etc:/etc/mat-runtime
    ports:
      - '127.0.0.1:${MAT_IT_HTTP_PORT:-18080}:8080'
      - '127.0.0.1:${MAT_IT_HTTPS_PORT:-18443}:8443'
      - '127.0.0.1:${MAT_IT_SIM_PORT:-18503}:1503'
    stop_grace_period: 5s
    networks:
      # gw_priority (Docker 28+): lan là cổng mặc định, nên cổng loopback của máy dev luôn vào qua lan; không có thì
      # Docker có lúc chọn pub và runtime thấy nguồn công cộng (403 viewerAccess private).
      lan: { ipv4_address: '${MAT_IT_LAN:-172.30.7}.10', priority: 100, gw_priority: 100 }
      pub: { ipv4_address: '${MAT_IT_PUB:-203.0.113}.10' }

  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /src/tools/modbus-sim/sim.mjs
      - --tcp
      - '1502'
      - --control
      - '1503'
      - --control-host
      - 0.0.0.0
      - --map
      - ${MAT_IT_MAP:-/src/tools/modbus-sim/maps/modbus-demo.json}
      - --log
      - /logs/requests.jsonl
    init: true
    network_mode: 'service:rt'
    volumes:
      - ../..:/src:ro
      - sim-logs:/logs
    depends_on: [rt]

  client:
    image: node:22.23.3-alpine
    command: ['sleep', 'infinity']
    init: true
    pid: 'service:rt'
    environment:
      MAT_IT_LAN_IP: '${MAT_IT_LAN:-172.30.7}.50'
      MAT_IT_PUB_IP: '${MAT_IT_PUB:-203.0.113}.50'
    volumes:
      - ../..:/src:ro
      - rt-data:/rt-data
    networks:
      lan: { ipv4_address: '${MAT_IT_LAN:-172.30.7}.50' }
      pub: { ipv4_address: '${MAT_IT_PUB:-203.0.113}.50' }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: '${MAT_IT_LAN:-172.30.7}.0/24'
  pub:
    driver: bridge
    ipam:
      config:
        - subnet: '${MAT_IT_PUB:-203.0.113}.0/24'

volumes:
  rt-data:
  rt-etc:
  sim-logs:
