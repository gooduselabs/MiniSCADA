# Rig tích hợp x64 của feature 009 (specs/009-alarms T039, T040, T065, T099, T111-T116), chạy bởi tools/alarm-it.ps1:
# runtime x64 dưới vòng giám sát của tests/device-it (supervise.sh) và giả lập Modbus TCP dùng chung mạng của rt
# (project trỏ 127.0.0.1:1502; cổng điều khiển giả lập 1503 mở ra máy dev ở 127.0.0.1:28503).
# Client Node và Chrome (puppeteer-core) chạy trên máy dev, vào rt qua cổng loopback 28443/28080.
# Cổng và mạng khác web-it/device-it để chạy được cạnh các rig khác. Mật khẩu thử sinh ngẫu nhiên mỗi lần chạy.
name: mat-alarm-it

services:
  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command: ['sh', '/src/tests/device-it/supervise.sh', '--no-discovery', '--max-live-clients-per-source', '10']
    environment:
      MAT_IT_PROJECT: ${MAT_IT_PROJECT:-/src/tests/alarm-it/projects/it-basic}
    volumes:
      - ../..:/src:ro
      - ${MAT_IT_BUILD:?MAT_IT_BUILD}:/build:ro
      - rt-data:/data
      - rt-etc:/etc/mat-runtime
    ports:
      - '127.0.0.1:28080:8080'
      - '127.0.0.1:28443:8443'
      - '127.0.0.1:28503:1503'
    stop_grace_period: 5s
    networks:
      lan: { ipv4_address: 172.30.19.10 }

  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /src/tools/modbus-sim/sim.mjs
      - --tcp
      - '1502'
      - --control
      - '1503'
      - --control-host
      - 0.0.0.0
      - --map
      - ${MAT_IT_MAP:-/src/tests/alarm-it/map.json}
    init: true
    network_mode: 'service:rt'
    volumes:
      - ../..:/src:ro
    depends_on: [rt]

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.19.0/24

volumes:
  rt-data:
  rt-etc:
