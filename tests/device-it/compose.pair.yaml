# Rig so cặp trước/sau của feature 011 (specs/011-pilot-hardening T200, SC-042), chạy bởi
# tests/device-it/pair-011-rig.mjs: một runtime x64 (cây nguồn PAIR_SRC, bản dựng PAIR_BUILD: bản trước 011 hoặc
# bản hiện tại) dưới supervise.sh của chính cây đó, với viewerAccess private và project 0.6 training-demo
# (PAIR_PROJ, cùng một thư mục cho cả hai lần), giả lập Modbus dùng chung mạng của rt, và client Node chạy
# tests/device-it/pair-011.mjs từ cây hiện tại (PAIR_CLIENT_SRC), nên bộ kiểm giống hệt nhau.
#
# lan 172.30.71.0/24 (RFC1918): rt .10, client .50
# pub 203.0.113.0/24 (không phải mạng riêng): rt .10, client .50
# Mật khẩu thử do pair-011-rig.mjs sinh ngẫu nhiên mỗi lần chạy (--password-stdin); không có gì bí mật ở đây.
services:
  rt:
    image: mat-armhf
    working_dir: /
    hostname: rt
    command:
      ['sh', '/src/tests/device-it/supervise.sh', '--no-discovery', '--viewer-access', 'private']
    environment:
      MAT_IT_PROJECT: /proj
    volumes:
      - ${PAIR_SRC:?PAIR_SRC}:/src:ro
      - ${PAIR_BUILD:?PAIR_BUILD}:/build:ro
      - ${PAIR_PROJ:?PAIR_PROJ}:/proj:ro
      - rt-data:/data
      - rt-etc:/etc/mat-runtime
    stop_grace_period: 5s
    networks:
      lan: { ipv4_address: '172.30.71.10', priority: 100 }
      pub: { ipv4_address: '203.0.113.10' }

  sim:
    image: node:22.23.3-alpine
    command:
      - node
      - /cur/tools/modbus-sim/sim.mjs
      - --tcp
      - '1502'
      - --control
      - '1503'
      - --map
      - /cur/tools/modbus-sim/maps/training-demo.json
    init: true
    network_mode: 'service:rt'
    volumes:
      - ${PAIR_CLIENT_SRC:?PAIR_CLIENT_SRC}:/cur:ro
    depends_on: [rt]

  client:
    image: node:22.23.3-alpine
    command: ['sleep', 'infinity']
    init: true
    volumes:
      - ${PAIR_CLIENT_SRC:?PAIR_CLIENT_SRC}:/src:ro
    networks:
      lan: { ipv4_address: '172.30.71.50' }
      pub: { ipv4_address: '203.0.113.50' }

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: '172.30.71.0/24'
  pub:
    driver: bridge
    ipam:
      config:
        - subnet: '203.0.113.0/24'

volumes:
  rt-data:
  rt-etc:
