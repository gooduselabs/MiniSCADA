<!-- Mockup tương tác khung mAT Studio GĐ 1 (docs/architecture/studio-ux.md, lộ trình v2 mục 4.1).
     Mở trực tiếp bằng Chrome, không cần mạng. Đây không phải mã sản phẩm: dùng để chốt bố cục và màu. -->
<!-- ARTIFACT-START -->
<title>Mockup mAT Studio</title>
<style>
/* Bố cục: cửa sổ ứng dụng kiểu IDE 7 vùng (cây project + details | tab editor + inspector | task card),
   đặt trên nền desktop. Một màu nhấn petrol (tạm, chờ màu thương hiệu); màu trạng thái cố định (studio-ux.md §7). */
:root {
  --desk: #d3dadd;
  --bg: #edf0f1;
  --panel: #ffffff;
  --panel-2: #f5f7f8;
  --hover: #e6ecee;
  --border: #d2d9dc;
  --border-2: #b3bec3;
  --fg: #1a2225;
  --muted: #56646a;
  --accent: #0b7285;
  --accent-ink: #ffffff;
  --accent-soft: #d6edf0;
  --sel: #cde7ec;
  --ok: #15703a;
  --ok-soft: #dcf1e3;
  --warn: #8f5e00;
  --warn-soft: #fbefcf;
  --err: #c42b2b;
  --err-soft: #fbe1e1;
  --info: #0b5cad;
  --info-soft: #dde9f7;
  --online: #e8590c;
  --online-ink: #a23a05;
  --online-soft: #fde7da;
  --off: #6b777c;
  --canvas: #dfe5e8;
  --scrim: rgba(12, 22, 26, 0.36);
  --mock-bg: #23313a;
  --mock-fg: #eef3f5;
  --mock-muted: #aebdc3;
  --mock-line: #3c4b54;
  --shadow: 0 12px 32px rgba(16, 34, 42, 0.18), 0 2px 6px rgba(16, 34, 42, 0.08);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, Menlo, monospace;
  --fs: 13px;
  --fs-s: 12px;
  --fs-xs: 11px;
  --row: 24px;
  --left-w: 264px;
  --details-h: 196px;
  --insp-h: 218px;
  --tc-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #090c0d; --bg: #131718; --panel: #191e20; --panel-2: #1e2427; --hover: #262e32;
    --border: #2d363a; --border-2: #435055; --fg: #e1e8ea; --muted: #9aa9af;
    --accent: #3ab1c1; --accent-ink: #04191d; --accent-soft: #133a40; --sel: #15404a;
    --ok: #52c672; --ok-soft: #15321e; --warn: #e4b545; --warn-soft: #372b10;
    --err: #ff7070; --err-soft: #3b1919; --info: #70b2f6; --info-soft: #152a42;
    --online: #ff8a3d; --online-ink: #ffb27c; --online-soft: #3d230f; --off: #8d9a9f;
    --canvas: #0e1214; --scrim: rgba(0, 0, 0, 0.55);
    --mock-bg: #e8eef0; --mock-fg: #17242a; --mock-muted: #4d5f66; --mock-line: #c2ced3;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #090c0d; --bg: #131718; --panel: #191e20; --panel-2: #1e2427; --hover: #262e32;
  --border: #2d363a; --border-2: #435055; --fg: #e1e8ea; --muted: #9aa9af;
  --accent: #3ab1c1; --accent-ink: #04191d; --accent-soft: #133a40; --sel: #15404a;
  --ok: #52c672; --ok-soft: #15321e; --warn: #e4b545; --warn-soft: #372b10;
  --err: #ff7070; --err-soft: #3b1919; --info: #70b2f6; --info-soft: #152a42;
  --online: #ff8a3d; --online-ink: #ffb27c; --online-soft: #3d230f; --off: #8d9a9f;
  --canvas: #0e1214; --scrim: rgba(0, 0, 0, 0.55);
  --mock-bg: #e8eef0; --mock-fg: #17242a; --mock-muted: #4d5f66; --mock-line: #c2ced3;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--fg); font: var(--fs)/1.38 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ic.lg { width: 22px; height: 22px; }
.ic.sm { width: 12px; height: 12px; }
.ic.ok { color: var(--ok); } .ic.warn { color: var(--warn); } .ic.err { color: var(--err); } .ic.info { color: var(--info); }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.pad { padding: 8px 12px; margin: 0; }
label.inline { display: inline-flex; align-items: center; gap: 6px; }
kbd { font-family: var(--mono); font-size: 10.5px; padding: 0 4px; border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 3px; color: var(--muted); background: var(--panel); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- Cửa sổ ---------- */
.desk { height: 100%; padding: 16px; display: flex; min-width: 0; }
.win { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template-rows: 34px 40px minmax(0, 1fr) 26px; background: var(--bg); border: 1px solid var(--border-2); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; position: relative; }

.titlebar { display: flex; align-items: center; gap: 6px; padding-left: 10px; background: var(--panel-2); border-bottom: 1px solid var(--border); min-width: 0; }
.logo { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.menubar { display: flex; gap: 1px; margin-left: 2px; }
.menubar button { border: 0; background: none; padding: 3px 8px; border-radius: 4px; }
.menubar button:hover, .menubar button[aria-expanded="true"] { background: var(--hover); }
.title-text { flex: 1; min-width: 0; text-align: center; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title-text b { color: var(--fg); font-weight: 600; }
.title-text .dirty { color: var(--accent); margin-left: 4px; }
.online-chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: 11px; background: var(--online-soft); color: var(--online-ink); font-weight: 600; font-size: var(--fs-s); white-space: nowrap; }
.online-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--online); }
.winctl { display: flex; align-self: stretch; }
.winctl span { width: 44px; display: grid; place-items: center; color: var(--muted); }

.toolbar { display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--border); min-width: 0; overflow: hidden; }
.win.online .toolbar { box-shadow: inset 0 -2px 0 var(--online); }
.tgroup { display: flex; gap: 2px; flex: none; }
.tsep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex: none; }
.ibtn, .tbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; border: 1px solid transparent; background: none; border-radius: 4px; color: var(--fg); padding: 0 7px; white-space: nowrap; flex: none; }
.ibtn { width: 28px; justify-content: center; padding: 0; }
.ibtn.sm { width: 22px; height: 22px; }
.ibtn:hover, .tbtn:hover { background: var(--hover); }
.tbtn[aria-pressed="true"] { background: var(--online-soft); color: var(--online-ink); border-color: var(--online); }
.ibtn:disabled, .tbtn:disabled { opacity: 0.45; cursor: default; background: none; }
.tspacer { flex: 1; min-width: 8px; }
.tsearch { display: inline-flex; align-items: center; gap: 8px; height: 26px; width: 250px; min-width: 0; padding: 0 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); border-radius: 4px; flex: none; }
.tsearch span { flex: 1; text-align: left; }
#tbTree, #burger { display: none; }

/* ---------- Vùng chính ---------- */
.main { display: grid; grid-template-columns: var(--left-w) 4px minmax(0, 1fr) auto; min-height: 0; min-width: 0; position: relative; }
.left { display: grid; grid-template-rows: minmax(0, 1fr) 4px var(--details-h); min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--border); }
.split-v { cursor: col-resize; background: var(--bg); touch-action: none; }
.split-h { cursor: row-resize; background: var(--bg); touch-action: none; }
.split-v:hover, .split-h:hover, .split-v.drag, .split-h.drag { background: var(--accent-soft); }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.pane-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 28px; padding: 0 6px 0 10px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); flex: none; white-space: nowrap; }
.pane-h span { overflow: hidden; text-overflow: ellipsis; }

.tree { flex: 1; overflow: auto; padding: 4px 0; outline: none; }
.ti { display: flex; align-items: center; gap: 5px; height: var(--row); padding-right: 8px; white-space: nowrap; border-left: 2px solid transparent; user-select: none; }
.ti:hover { background: var(--hover); }
.ti[aria-selected="true"] { background: var(--sel); border-left-color: var(--accent); }
.tree:focus-visible .ti[aria-selected="true"] { outline: 1px dotted var(--accent); outline-offset: -1px; }
.ti .tw { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); flex: none; }
.ti .lbl { overflow: hidden; text-overflow: ellipsis; }
.ti .sub { color: var(--muted); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; }
.ti .end { margin-left: auto; display: flex; align-items: center; gap: 6px; padding-left: 8px; }
.cnt { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.phase { display: none; font-size: 10px; line-height: 14px; padding: 0 5px; border: 1px dashed var(--border-2); border-radius: 7px; color: var(--muted); white-space: nowrap; font-weight: 500; letter-spacing: 0; text-transform: none; }
.show-phases .phase { display: inline-block; }
.cmp { font-family: var(--mono); font-weight: 700; width: 14px; text-align: center; font-size: 12px; }
.cmp.eq { color: var(--ok); } .cmp.ne { color: var(--warn); } .cmp.add { color: var(--info); } .cmp.del { color: var(--err); }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
.sdot.on { background: var(--ok); }

.details { flex: 1; overflow: auto; }
.dl-row { display: flex; align-items: center; gap: 8px; height: var(--row); padding: 0 10px; font-size: var(--fs-s); white-space: nowrap; }
.dl-row:hover { background: var(--hover); }
.dl-row.sel { background: var(--sel); }
.dl-row .t { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.dl-row[draggable="true"] { cursor: grab; }

.center { display: grid; grid-template-rows: 32px minmax(0, 1fr) 4px var(--insp-h); min-width: 0; min-height: 0; position: relative; }
.win.online .center::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--online); pointer-events: none; z-index: 5; }
.tabbar { display: flex; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; min-width: 0; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 4px 0 12px; border-right: 1px solid var(--border); color: var(--muted); white-space: nowrap; position: relative; cursor: default; flex: none; }
.tab:hover { background: var(--hover); }
.tab[aria-selected="true"] { background: var(--panel); color: var(--fg); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); }
.tab .x { width: 20px; height: 20px; display: grid; place-items: center; border: 0; background: none; border-radius: 3px; color: var(--muted); padding: 0; }
.tab .x:hover { background: var(--hover); color: var(--fg); }
.tab .dirty { color: var(--accent); font-size: 10px; }
.tab .nox { width: 6px; }
.editor { min-height: 0; min-width: 0; overflow: auto; background: var(--panel); }

.inspector { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-top: 1px solid var(--border); }
.insp-tabs { display: flex; align-items: stretch; height: 30px; border-bottom: 1px solid var(--border); background: var(--panel-2); flex: none; padding-left: 4px; min-width: 0; }
.insp-tabs [role="tab"] { border: 0; background: none; padding: 0 12px; color: var(--muted); position: relative; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.insp-tabs [role="tab"][aria-selected="true"] { color: var(--fg); }
.insp-tabs [role="tab"][aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--accent); }
.insp-ctx { margin-left: auto; align-self: center; padding: 0 10px; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.insp-body { flex: 1; overflow: auto; min-height: 0; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10.5px; font-weight: 600; background: var(--err-soft); color: var(--err); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge:empty { display: none; }

.right { display: flex; min-height: 0; border-left: 1px solid var(--border); background: var(--panel); position: relative; }
.tc-panel { width: var(--tc-w); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--panel); }
.right.collapsed .tc-panel { display: none; }
.tc-body { flex: 1; overflow: auto; min-height: 0; }
.tc-strip { width: 30px; display: flex; flex-direction: column; gap: 2px; padding: 6px 0; background: var(--panel-2); }
.tc-strip [role="tab"] { writing-mode: vertical-rl; border: 0; border-left: 2px solid transparent; background: none; color: var(--muted); padding: 10px 0; display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); white-space: nowrap; }
.tc-strip [role="tab"]:hover { color: var(--fg); }
.right:not(.collapsed) .tc-strip [role="tab"][aria-selected="true"] { color: var(--fg); border-left-color: var(--accent); background: var(--panel); }

.statusbar { display: flex; align-items: center; padding: 0 4px; background: var(--panel-2); border-top: 1px solid var(--border); font-size: var(--fs-s); color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.win.online .statusbar { background: var(--online-soft); color: var(--online-ink); border-top-color: var(--online); }
.sb { display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 8px; border: 0; background: none; color: inherit; flex: none; }
button.sb:hover { background: var(--hover); }
.sb-sep { width: 1px; height: 14px; background: var(--border-2); flex: none; }
.sb-grow { flex: 1; min-width: 4px; }
.sb .e { color: var(--err); } .sb .w { color: var(--warn); }
.sb .bar { width: 80px; }

/* ---------- Thành phần dùng chung ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 12px; border: 1px solid var(--border-2); background: var(--panel); border-radius: 4px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.btn.primary:disabled:hover, .btn:disabled:hover { background: var(--panel); }
.btn.primary:disabled:hover { background: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 7px; border-radius: 9px; font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; background: var(--hover); color: var(--muted); }
.chip .ic { width: 12px; height: 12px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.err { background: var(--err-soft); color: var(--err); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.online { background: var(--online-soft); color: var(--online-ink); }
.input, .select { height: 28px; padding: 0 8px; border: 1px solid var(--border-2); border-radius: 4px; background: var(--panel); min-width: 0; }
.input.sm { height: 24px; }
.input:focus, .select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.input[readonly] { background: var(--panel-2); color: var(--muted); }
.field { display: grid; gap: 4px; align-content: start; min-width: 0; }
.field > label { font-size: var(--fs-s); color: var(--muted); }
.help { font-size: var(--fs-xs); color: var(--muted); margin: 0; }
.err-text { font-size: var(--fs-xs); color: var(--err); margin: 0; }
.bar { height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden; display: block; }
.bar i { display: block; height: 100%; min-width: 3px; background: var(--accent); border-radius: 2px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-2); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { display: grid; justify-items: center; gap: 6px; padding: 22px 16px; text-align: center; color: var(--muted); }
.empty b { color: var(--fg); }
.empty p { margin: 0; max-width: 48ch; }

/* ---------- Editor ---------- */
.ed { min-height: 100%; }
.ed-fill { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.ed-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; flex: none; }
.ed-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ed-head .path { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.ed-tools { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-bottom: 1px solid var(--border); background: var(--panel-2); flex-wrap: wrap; flex: none; }
.ed-tools .tbtn { height: 26px; }
.ed-tools .input { width: 180px; }
.banner { display: flex; gap: 10px; align-items: flex-start; margin: 12px 14px 0; padding: 10px 12px; border-radius: 6px; background: var(--info-soft); font-size: var(--fs-s); max-width: 900px; }
.banner .ic { margin-top: 1px; }
.banner.warn { background: var(--warn-soft); }

.gridwrap { overflow: auto; min-height: 0; outline: none; }
.ed-fill > .gridwrap { flex: 1; }
.gridwrap:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: var(--fs-s); }
.grid th { position: sticky; top: 0; z-index: 1; height: 26px; padding: 0 8px; text-align: left; font-weight: 600; color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; }
.grid td { height: var(--row); padding: 0 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; background: var(--panel); }
.grid td.rn, .grid th.rn { color: var(--muted); text-align: right; background: var(--panel-2); width: 40px; position: sticky; left: 0; z-index: 1; }
.grid th.rn { z-index: 2; }
.grid tr:hover td { background: var(--hover); }
.grid tr.rsel td { background: var(--sel); }
.grid tr.rsel td.rn { color: var(--fg); }
.grid td.cur { box-shadow: inset 0 0 0 2px var(--accent); }
.grid tbody tr td.bad { background: var(--err-soft); color: var(--err); box-shadow: inset 0 0 0 1px var(--err); }
.grid tbody tr td.bad.cur { box-shadow: inset 0 0 0 2px var(--err); }
.grid td.ro { color: var(--muted); }
.grid td.r { text-align: right; font-variant-numeric: tabular-nums; }
.grid td.live { font-family: var(--mono); font-size: 11.5px; text-align: right; }
.grid td input, .grid td select { width: 100%; min-width: 60px; height: 22px; border: 0; padding: 0 4px; background: var(--panel); color: var(--fg); outline: 2px solid var(--accent); border-radius: 2px; }
.grid.dense td, .grid.dense th { height: 26px; }
.grid tr[tabindex]:focus-visible td { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
.rn .cmp { margin-right: 4px; }

/* Bắt đầu */
.start { padding: 20px 24px 28px; display: grid; gap: 22px; max-width: 1200px; }
.start-hero { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.start-hero h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.start-hero p { margin: 4px 0 0; }
.start-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 22px; }
.sec { margin: 0 0 8px; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 2px 10px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
.tile:hover { border-color: var(--accent); background: var(--accent-soft); }
.tile .ic { width: 22px; height: 22px; color: var(--accent); grid-row: span 2; }
.tile b { font-weight: 600; }
.tile span { color: var(--muted); font-size: var(--fs-s); }
.list { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li small { color: var(--muted); font-size: var(--fs-xs); }
.roadmap { border: 1px solid var(--border); border-radius: 6px; padding: 4px 14px; }
.ph { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
.ph:last-child { border-bottom: 0; }
.ph .k { font-weight: 700; font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px; }
.ph.done .k { color: var(--ok); }
.ph.now .k { color: var(--accent); }
.ph b { display: block; font-weight: 600; }
.ph span { color: var(--muted); font-size: var(--fs-s); }

/* Form */
.form { padding: 14px; display: grid; gap: 16px; max-width: 820px; }
fieldset { border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px 14px; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; min-width: 0; }
legend { padding: 0 6px; font-weight: 600; font-size: var(--fs-s); }
.form.narrow { padding: 0; max-width: 380px; gap: 12px; }

/* Màn hình */
.cv { flex: 1; min-height: 0; display: grid; grid-template-columns: 20px minmax(0, 1fr); grid-template-rows: 20px minmax(0, 1fr); background: var(--canvas); }
.ruler { background-color: var(--panel-2); position: relative; overflow: hidden; font-size: 9.5px; color: var(--muted); font-family: var(--mono); }
.ruler-corner { background: var(--panel-2); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.rt { border-bottom: 1px solid var(--border); background-image: linear-gradient(to right, var(--border-2) 1px, transparent 1px); background-size: var(--tick, 50px) 6px; background-repeat: repeat-x; background-position: var(--off, 0px) 100%; }
.rl { border-right: 1px solid var(--border); background-image: linear-gradient(to bottom, var(--border-2) 1px, transparent 1px); background-size: 6px var(--tick, 50px); background-repeat: repeat-y; background-position: 100% var(--off, 0px); }
.rt span { position: absolute; top: 2px; }
.rl span { position: absolute; left: 2px; writing-mode: vertical-rl; transform: rotate(180deg); }
.cv-scroll { overflow: auto; min-width: 0; min-height: 0; position: relative; }
.cv-inner { position: relative; padding: 40px; width: max-content; }
.board { position: relative; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.28); }
.board svg { display: block; width: 100%; height: 100%; }
.board [data-mat-uid] { cursor: pointer; }
.board [data-mat-uid]:hover { filter: brightness(1.25); }
.gridov { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(255, 255, 255, 0.2) 1px, transparent 1.3px); background-size: var(--g, 20px) var(--g, 20px); }
.selbox { position: absolute; border: 1px solid var(--accent); pointer-events: none; }
.selbox i { position: absolute; width: 7px; height: 7px; background: var(--panel); border: 1px solid var(--accent); }
.selbox .nm { position: absolute; left: -1px; bottom: 100%; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; padding: 1px 6px; border-radius: 3px 3px 0 0; white-space: nowrap; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 4px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--panel); padding: 0 10px; height: 24px; color: var(--fg); }
.seg button + button { border-left: 1px solid var(--border-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { color: var(--muted); cursor: default; }

/* Inspector */
.prow { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 26px; padding: 1px 12px; border-bottom: 1px solid var(--border); }
.prow .pl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psec { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; font-weight: 600; font-size: var(--fs-s); }
.ptabs { display: flex; gap: 2px; padding: 6px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.ptabs button { border: 1px solid transparent; background: none; border-radius: 4px; padding: 2px 10px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.ptabs button[aria-pressed="true"] { border-color: var(--border-2); background: var(--panel-2); color: var(--fg); }
.dyn { display: inline-flex; align-items: center; gap: 5px; height: 22px; max-width: 210px; padding: 0 7px; border: 1px dashed var(--border-2); border-radius: 4px; background: none; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; }
.dyn.on { border: 1px solid transparent; background: var(--accent-soft); color: var(--fg); font-family: var(--mono); }
.dyn.drop { outline: 2px solid var(--accent); }
.dyn span { overflow: hidden; text-overflow: ellipsis; }
.xref { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 2px; }
.xref li { display: flex; gap: 8px; align-items: center; font-size: var(--fs-s); min-height: 22px; }
.issue { display: grid; grid-template-columns: 16px 170px 200px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 28px; padding: 2px 12px; border-bottom: 1px solid var(--border); cursor: default; }
.issue:hover { background: var(--hover); }
.issue .loc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diag { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; padding: 10px 12px; }
.metric { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.metric .l { color: var(--muted); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.05em; }
.metric .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.metric .n { color: var(--muted); font-size: var(--fs-xs); }

/* Task card */
.acc { border-bottom: 1px solid var(--border); }
.acc > button { width: 100%; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; background: none; font-weight: 600; font-size: var(--fs-s); }
.acc > button:hover { background: var(--hover); }
.acc .items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 2px 10px 10px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 4px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel-2); font-size: var(--fs-xs); text-align: center; cursor: grab; }
.tool:hover { border-color: var(--accent); }
.tool .ic { width: 20px; height: 20px; color: var(--accent); }
.tc-sec { padding: 10px 10px 4px; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.tc-actions { display: grid; gap: 6px; padding: 6px 10px 12px; }
.tc-actions .btn { justify-content: flex-start; }
.find { display: grid; gap: 6px; padding: 10px; }
.find-row { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 5px 6px; border-radius: 4px; }
.find-row:hover { background: var(--hover); }
.find-row span { display: grid; min-width: 0; }
.find-row small { color: var(--muted); font-size: var(--fs-xs); }
.mini { display: grid; gap: 8px; padding: 6px 10px; }
.mini .metric { padding: 6px 8px; }

/* Hộp thoại, menu, bảng lệnh */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dlg { width: min(780px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border-2); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.dlg-h { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border); font-weight: 600; flex: none; }
.dlg-h .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlg-b { padding: 14px; overflow: auto; min-height: 0; display: grid; gap: 12px; align-content: start; }
.dlg-f { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--panel-2); border-radius: 0 0 8px 8px; flex-wrap: wrap; flex: none; }
.scan { display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); }
.scan .bar { flex: 1; max-width: 220px; }
.framed { border: 1px solid var(--border); border-radius: 6px; max-height: 250px; }
.devdetail { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); }
.kvs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; font-size: var(--fs-s); margin: 0; }
.kvs dt { color: var(--muted); }
.kvs dd { margin: 0; overflow-wrap: anywhere; }
.fp { padding: 10px 12px; border: 1px dashed var(--border-2); border-radius: 6px; background: var(--panel-2); word-break: break-all; line-height: 1.75; }
.note-box { display: flex; gap: 12px; align-items: flex-start; }
.note-box p { margin: 4px 0 0; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps li { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border-radius: 4px; }
.steps li.run { background: var(--accent-soft); font-weight: 600; }
.steps li.wait { color: var(--muted); }
.steps li.fail { background: var(--err-soft); color: var(--err); font-weight: 600; }
.steps .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-2); flex: none; }
.result { display: flex; gap: 12px; padding: 12px 14px; border-radius: 6px; align-items: flex-start; }
.result.ok { background: var(--ok-soft); }
.result.err { background: var(--err-soft); }
.result p { margin: 4px 0 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-s); color: var(--muted); }
.legend span { display: inline-flex; gap: 4px; align-items: center; }
h4.sub { margin: 2px 0 -4px; font-size: var(--fs-s); font-weight: 600; }
.radio { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
.radio.on { border-color: var(--accent); background: var(--accent-soft); }
.radio input { margin: 2px 0 0; }
.radio small { grid-column: 2; color: var(--muted); font-size: var(--fs-s); }
.menu-pop { position: fixed; min-width: 240px; max-width: calc(100% - 16px); max-height: calc(100% - 60px); overflow: auto; background: var(--panel); border: 1px solid var(--border-2); border-radius: 6px; box-shadow: var(--shadow); padding: 4px; z-index: 55; }
.menu-pop button { width: 100%; display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px; border: 0; background: none; border-radius: 4px; text-align: left; white-space: nowrap; }
.menu-pop button:hover, .menu-pop button:focus-visible { background: var(--hover); outline: none; }
.menu-pop .k { margin-left: auto; padding-left: 16px; color: var(--muted); font-size: var(--fs-xs); font-family: var(--mono); }
.menu-pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.menu-pop .hd { padding: 4px 8px; font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.palette { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--border-2); border-radius: 8px; box-shadow: var(--shadow); z-index: 56; overflow: hidden; }
.palette input { width: 100%; height: 40px; border: 0; border-bottom: 1px solid var(--border); padding: 0 14px; background: var(--panel); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 4px; max-height: min(360px, 60vh); overflow: auto; }
.palette li { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 0 10px; border-radius: 4px; cursor: pointer; }
.palette li span { flex: 1; min-width: 0; }
.palette li[aria-selected="true"] { background: var(--sel); }
.palette li.empty { color: var(--muted); cursor: default; }
.toast { position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%); max-width: min(620px, calc(100% - 32px)); padding: 9px 14px; border-radius: 6px; background: var(--fg); color: var(--panel); font-size: var(--fs-s); box-shadow: var(--shadow); z-index: 60; }

/* Bảng điều khiển mockup (không thuộc sản phẩm) */
.mock { position: fixed; right: 24px; bottom: 42px; width: 290px; max-width: calc(100% - 32px); background: var(--mock-bg); color: var(--mock-fg); border-radius: 10px; box-shadow: var(--shadow); z-index: 40; font-size: var(--fs-s); }
.mock-h { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; }
.mock-h b { letter-spacing: 0.08em; font-size: var(--fs-xs); }
.mock-h .ibtn { color: var(--mock-fg); }
.mock-h .ibtn:hover { background: var(--mock-line); }
.mock.min .mock-b { display: none; }
.mock-b { padding: 8px 12px 10px; display: grid; gap: 8px; border-top: 1px solid var(--mock-line); }
.mock .seg { border-color: var(--mock-line); }
.mock .seg button { background: none; color: var(--mock-fg); height: 24px; }
.mock .seg button + button { border-left-color: var(--mock-line); }
.mock .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.mock .lnk { border: 1px solid var(--mock-line); background: none; color: var(--mock-fg); border-radius: 5px; padding: 3px 8px; }
.mock .lnk:hover { border-color: var(--accent); }
.mock .lnks { display: flex; flex-wrap: wrap; gap: 6px; }
.mock .note { color: var(--mock-muted); font-size: var(--fs-xs); margin: 0; }
.mock .lab { color: var(--mock-muted); font-size: var(--fs-xs); min-width: 64px; }

/* ---------- Màn hình hẹp ---------- */
@media (max-width: 1180px) {
  .right .tc-panel { position: absolute; right: 30px; top: 0; bottom: 0; z-index: 20; box-shadow: var(--shadow); }
  .tsearch { width: 190px; }
}
@media (max-width: 900px) {
  .main { grid-template-columns: 0 0 minmax(0, 1fr) auto; }
  .left, .split-v { visibility: hidden; }
  .win.tree-open .left { visibility: visible; position: absolute; left: 0; top: 0; bottom: 0; width: min(300px, 86%); z-index: 21; box-shadow: var(--shadow); }
  #tbTree { display: inline-flex; }
  .toolbar .tbtn span { display: none; }
  .tsearch { width: 30px; justify-content: center; padding: 0; }
  .tsearch span, .tsearch kbd { display: none; }
  .title-text { display: none; }
  .start-grid { grid-template-columns: minmax(0, 1fr); }
  .issue { grid-template-columns: 16px minmax(0, 1fr); }
  .issue .loc { grid-column: 2; }
  .issue .msg { grid-column: 2; white-space: normal; }
}
@media (max-width: 640px) {
  .menubar, .winctl, .opt-s { display: none; }
  #burger { display: inline-flex; }
  .online-chip { margin-left: auto; }
  .center { grid-template-rows: 32px minmax(0, 1fr) 4px 160px; }
  .statusbar .hide-s { display: none; }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .start { padding: 14px; }
  .prow { grid-template-columns: 110px minmax(0, 1fr) auto; }
  .mock { right: 16px; left: 16px; width: auto; max-width: none; bottom: 36px; }
}
</style>

    d.body.replaceChildren(h('table', { class: 'grid dense' }, h('tbody', null, rows.map(([k, v]) => h('tr', null, h('td', { style: 'width:160px' }, h('kbd', { text: k })), h('td', { text: v }))))), h('p', { class: 'help', text: 'Trong trình duyệt, Chrome giữ một số phím (Ctrl+L, Ctrl+K…). Trong ứng dụng Studio thì dùng được hết.' }));
    d.foot.replaceChildren(h('span', { class: 'grow' }), h('button', { class: 'btn primary', type: 'button', onclick: () => closeDialog() }, 'Đóng'));
  }

  // ---------- Menu và bảng lệnh ----------
  let menuBtn = null;
  function openMenuAt(anchor, items, owner) {
    const pop = $('#menuPop');
    pop.replaceChildren(...items.map((it) => {
      if (it === '-') return h('hr');
      if (it.hd) return h('div', { class: 'hd', text: it.hd });
      const [label, key, run] = typeof it === 'string' ? [CMD[it].label, CMD[it].key, CMD[it].run] : it;
      return h('button', { type: 'button', role: 'menuitem', onclick: () => { closeMenu(); run(); } }, h('span', { text: label }), key ? h('span', { class: 'k', text: key }) : null);
    }));
    pop.hidden = false;
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth;
    pop.style.left = clamp(r.left, 8, window.innerWidth - w - 8) + 'px';
    const top = r.bottom + 4;
    pop.style.top = (top + pop.offsetHeight > window.innerHeight - 8 ? Math.max(8, r.top - pop.offsetHeight - 4) : top) + 'px';
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');

  }
  function closeMenu() {
    $('#menuPop').hidden = true;

  }
  $$('#menubar button').forEach((b) => {
    b.addEventListener('click', (e) => { e.stopPropagation(); if (menuBtn === b) closeMenu(); else openMenuAt(b, MENUS[b.dataset.menu], b); });
    b.addEventListener('mouseenter', () => { if (menuBtn && menuBtn !== b && !$('#menuPop').hidden) openMenuAt(b, MENUS[b.dataset.menu], b); });
  });
  $('#menuPop').addEventListener('keydown', (e) => {
    const items = $$('#menuPop button');
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); const b = menuBtn; closeMenu(); if (b) b.focus(); }
  });
  function openBindMenu(anchor, uid, target) {
    const b = (S.binds[uid] || []).find((x) => x.t === target);
    const items = [{ hd: `${TARGET_NAMES[target] || target} ← Tag` }].concat(S.tags.filter((t) => t.id).map((t) => [t.id, t.type, () => setBinding(uid, target, t.id)]));
    items.push('-', ['Biểu thức…', 'GĐ 2', () => toast('Gắn biểu thức (Tag tính toán) có ở GĐ 2.')], ['Bảng giá trị…', 'GĐ 2', () => toast('Gắn bảng giá trị có ở GĐ 2.')]);
    if (b) items.push('-', ['Bỏ gắn', '', () => setBinding(uid, target, null)]);
    openMenuAt(anchor, items, null);
  }
  document.addEventListener('mousedown', (e) => {
    if (!$('#menuPop').hidden && !e.target.closest('#menuPop') && !e.target.closest('#menubar')) closeMenu();
    if (!$('#palette').hidden && !e.target.closest('#palette')) closePalette();
  });

  function openPalette() {
    closeMenu();
    $('#palette').hidden = false;
    $('#palInput').value = '';
    S.palSel = 0;
    fillPalette();
    $('#palInput').focus();
  }
  function closePalette() {
    $('#palette').hidden = true;
  }
  function fillPalette() {
    const q = fold($('#palInput').value.trim());
    const items = PALETTE.map((id) => Object.assign({ id }, CMD[id])).filter((c) => !q || fold(c.label).includes(q));
    S.palItems = items;
    if (S.palSel >= items.length) S.palSel = 0;
    const list = $('#palList');
    if (!items.length) return list.replaceChildren(h('li', { class: 'empty', text: 'Không có lệnh khớp' }));
    list.replaceChildren(...items.map((c, i) => h('li', { role: 'option', id: 'pal-' + c.id, 'aria-selected': String(i === S.palSel), onclick: () => runPalette(i), onmousemove: () => { if (S.palSel !== i) { S.palSel = i; fillPalette(); } } }, h('span', { text: c.label }), c.key ? h('kbd', { text: c.key }) : null)));
    $('#palInput').setAttribute('aria-activedescendant', 'pal-' + items[S.palSel].id);
  }
  function runPalette(i) {
    const c = S.palItems[i];
    if (!c) return;
    closePalette();
    c.run();
  }
  $('#palInput').addEventListener('input', () => { S.palSel = 0; fillPalette(); });
  $('#palInput').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); S.palSel = Math.min(S.palItems.length - 1, S.palSel + 1); fillPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); S.palSel = Math.max(0, S.palSel - 1); fillPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(S.palSel); }
    else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  });

  // ---------- Toast ----------
  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
  }

  // ---------- Bảng điều khiển mockup ----------
  function buildMock() {
    const m = $('#mock');
    const minimized = store.get('mockMin', window.innerWidth < 640);
    m.classList.toggle('min', minimized);
    const seg = (name, items, cur, set) => h('div', { class: 'seg', role: 'group', 'aria-label': name, data: { seg: name } }, items.map(([v, l]) => h('button', { type: 'button', 'aria-pressed': String(cur() === v), data: { v }, onclick: () => set(v) }, l)));
    const minBtn = h('button', { class: 'ibtn sm', type: 'button', 'aria-label': minimized ? 'Mở bảng mockup' : 'Thu bảng mockup', onclick: () => { const v = !m.classList.contains('min'); m.classList.toggle('min', v); store.set('mockMin', v); minBtn.setAttribute('aria-label', v ? 'Mở bảng mockup' : 'Thu bảng mockup'); minBtn.replaceChildren(ic(v ? 'plus' : 'minus')); } }, ic(minimized ? 'plus' : 'minus'));
    m.replaceChildren(
      h('div', { class: 'mock-h' }, h('b', { text: 'MOCKUP' }), h('span', { class: 'note', style: 'color:inherit;opacity:.8', text: 'GĐ 1 · bản 1 · 11/10/2026' }), h('span', { class: 'grow' }), minBtn),
      h('div', { class: 'mock-b' },
        h('div', { class: 'row' }, h('span', { class: 'lab', text: 'Giao diện' }), seg('theme', [['system', 'Hệ thống'], ['light', 'Sáng'], ['dark', 'Tối']], () => S.theme, setTheme)),
        h('div', { class: 'row' }, h('span', { class: 'lab', text: 'Thiết bị' }), seg('online', [['off', 'Offline'], ['on', 'Online']], () => (S.online ? 'on' : 'off'), (v) => { if (v === 'on') { S.pinned = true; S.loggedIn = true; setOnline(true); } else setOnline(false); })),
        h('label', { class: 'inline' }, h('input', { type: 'checkbox', id: 'mk-phases', checked: S.phases, onchange: togglePhases }), 'Hiện nhãn giai đoạn (GĐ 2, GĐ 3a…)'),
        h('label', { class: 'inline' }, h('input', { type: 'checkbox', id: 'mk-fail', onchange: (e) => { S.failDownload = e.target.checked; } }), 'Cho nạp xuống thất bại (xem tự rollback)'),
        h('div', { class: 'lnks' }, [['Thiết bị trong mạng', () => openDevices('browse')], ['Nạp xuống', () => needOnline('download')], ['So sánh', () => needOnline('compare')], ['Đọc lên', () => needOnline('upload')], ['Bảng lệnh', openPalette]].map(([l, f]) => h('button', { class: 'lnk', type: 'button', onclick: f }, l))),
        h('p', { class: 'note', text: 'Thử: Bảng Tag, nhấp đúp ô Max đỏ của TANK02.LEVEL, gõ 100, Enter: hết lỗi, Nạp xuống mở khóa. Dữ liệu là ví dụ từ tank-demo; bảng này không thuộc sản phẩm.' })));
  }
  function syncMock() {
    const m = $('#mock');
    for (const b of m.querySelectorAll('[data-seg="theme"] button')) b.setAttribute('aria-pressed', String(b.dataset.v === S.theme));
    for (const b of m.querySelectorAll('[data-seg="online"] button')) b.setAttribute('aria-pressed', String(b.dataset.v === (S.online ? 'on' : 'off')));
    const p = $('#mk-phases');
    if (p) p.checked = S.phases;
  }

  // ---------- Phím tắt ----------
  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') {
      if (!$('#palette').hidden) closePalette();
      else if (!$('#menuPop').hidden) closeMenu();
      else if (dlgClose) closeDialog();
      else $('#win').classList.remove('tree-open');
      return;
    }
    if (mod && e.shiftKey && k === 'p') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'F7') { e.preventDefault(); if (!dlgClose) runValidate(); return; }
    if (!mod || e.shiftKey || e.altKey) return;
    const map = { s: 'save', z: 'undo', y: 'redo', k: 'online', m: 'offline', l: 'download', f: 'find', d: 'fillDown' };
    const c = map[k];
    if (!c) return;
    const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
    if (inField && (k === 'z' || k === 'y')) return;
    e.preventDefault();
    if (dlgClose && c !== 'save') return;
    CMD[c].run();
  });

  // ---------- Nút thanh công cụ, kéo đổi cỡ ----------
  $$('[data-cmd]').forEach((b) => b.addEventListener('click', () => CMD[b.dataset.cmd].run()));
  $('#burger').addEventListener('click', openPalette);
  $('#tbTree').addEventListener('click', () => $('#win').classList.toggle('tree-open'));
  function setVar(name, v) {
    $('#win').style.setProperty(name, v);
  }
  function dragSplit(el, onMove) {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add('drag');
      const move = (ev) => onMove(ev);
      const up = () => {
        el.classList.remove('drag');
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        store.set('layout', { left: $('#win').style.getPropertyValue('--left-w'), details: $('#win').style.getPropertyValue('--details-h'), insp: $('#win').style.getPropertyValue('--insp-h') });
        if (S.active === 'screen') { if (S.zoomFit) fitZoom(); else updateSel(); }
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  }
  dragSplit($('#splitLeft'), (ev) => { const r = $('#main').getBoundingClientRect(); setVar('--left-w', clamp(ev.clientX - r.left, 180, 480) + 'px'); });
  dragSplit($('#splitDetails'), (ev) => { const r = $('#left').getBoundingClientRect(); setVar('--details-h', clamp(r.bottom - ev.clientY, 70, r.height - 120) + 'px'); });
  dragSplit($('#splitInsp'), (ev) => { const r = $('#center').getBoundingClientRect(); setVar('--insp-h', clamp(r.bottom - ev.clientY, 90, r.height - 150) + 'px'); });
  const lay = store.get('layout', null);
  if (lay) {
    if (lay.left) setVar('--left-w', lay.left);
    if (lay.details) setVar('--details-h', lay.details);
    if (lay.insp) setVar('--insp-h', lay.insp);
  }
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (S.active === 'screen') { if (S.zoomFit) fitZoom(); else { drawRulers(); updateSel(); } } }, 120);
  });

  // ---------- Mô phỏng giá trị Tag ----------
  function simTick() {
    const t = performance.now() / 1000;
    const s = S.sim;
    s.level = 50 + 28 * Math.sin(t / 7);
    s.run = Math.cos(t / 7) > 0;
    s.speed = s.run ? 1440 + 12 * Math.sin(t * 1.7) : Math.max(0, s.speed - 480);
    s.inflow = s.run ? 9 + 1.5 * Math.sin(t / 2.3) : 0.4;
    s.temp = 25.4 + 0.5 * Math.sin(t / 25);
    s.tempBad = t % 20 < 5;
    s.t2 = 35 + 6 * Math.sin(t / 11);
    S.diag.cpu = 11.7 + 1.6 * Math.sin(t / 3);
    S.diag.rss = 13.4 + 0.2 * Math.sin(t / 13);
  }
  setInterval(() => {
    simTick();
    if (S.online) {
      updateLiveCells();
      if (S.itab === 'diag') renderInspector();
      else if (S.itab === 'props' && S.selection && S.selection.kind === 'tag') renderInspector();
      if (S.tc === 'online' && S.tcOpen) renderTask();
    }
    if (S.active === 'screen' && S.preview !== 'off') {
      applyScreen();
      if (S.selection && S.selection.kind === 'el' && S.selection.uid === 'el_tank_level') updateSel();
    }
  }, 1000);
  let lastFrame = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;
    if (S.active === 'screen' && S.preview !== 'off' && !reduceMotion && S.ui.svg) {
      S.sim.angle = (S.sim.angle + S.sim.speed * 0.12 * dt) % 360;
      const fan = S.ui.svg.querySelector('[data-mat-uid="el_motor_fan"]');
      if (fan) fan.setAttribute('transform', `rotate(${S.sim.angle.toFixed(1)} 850 525)`);
    }
    requestAnimationFrame(frame);
  }

  // ---------- Khởi động ----------
  if (S.theme !== 'system') document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('show-phases', S.phases);
  simTick();
  buildMock();
  renderAll();
  requestAnimationFrame(frame);
})();
</script>
