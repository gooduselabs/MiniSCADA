name: ci
on: [push, pull_request]
permissions:
  contents: read
# The Studio Rust tests (apps/studio/src-tauri, `cargo test --lib`) are not run here: the Studio is
# Windows-only, its tests cover Windows paths (junctions, read-only rename), and a windows-latest job
# would build Tauri from scratch (not measured; 10+ minutes expected). They run in tools/ci-local.ps1
# on the Windows dev machine (decision 2026-10-12, feature 005 T151).
jobs:
  build-armhf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mat-armhf deployment/toolchain
      # clang-format chạy trong cùng image với máy dev (clang-format 10) để kết quả không lệch phiên bản
      - run: docker run --rm -v "$PWD:/src" mat-armhf sh -c "clang-format --dry-run -Werror \$(find core server drivers tools/hello-armhf -name '*.cpp' -o -name '*.hpp')"
      - run: docker run --rm -v "$PWD:/src" mat-armhf sh -c "cmake -S . -B build/armhf -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=deployment/toolchain/armhf.cmake && cmake --build build/armhf"
      # qemu-user-static registers binfmt with the F flag: containers can run armhf binaries, which
      # smoke-armhf.sh needs for the execv of a deploy (feature 005 T112, T151)
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      # the armhf runtime under qemu-user: a fault of the 32-bit build never shows in the x64 tests
      - run: docker run --rm -v "$PWD:/src" mat-armhf sh deployment/toolchain/smoke-armhf.sh
      # unit tests of the 32-bit build under qemu-user (feature 006 T003, T207): alignment, time_t, 64-bit
      # integers, the RTU tests on a pty
      - run: docker run --rm -v "$PWD:/src" mat-armhf sh deployment/toolchain/test-armhf.sh
      # deploy.sh + rollback.sh with stubbed systemctl/runuser in a throw-away container (review R-16)
      - run: docker run --rm -v "$PWD:/src" mat-armhf sh deployment/device/tests/deploy_rollback_test.sh
  test-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++
      # the large package vectors are not committed (tests/package-vectors/.gitignore)
      - run: node tests/package-vectors/generate.mjs --out
      - run: node tools/release/make-update.mjs --vectors --out --test
      - run: cmake -S . -B build/x64 -G Ninja && cmake --build build/x64 && cd build/x64 && ctest --output-on-failure
      # Feature 009 (T122): the alarm tests by name (engine, text, definitions, vectors, alarm.db, service, history, storm);
      # the armhf ones are in the default list of deployment/toolchain/test-armhf.sh.
      - run: cmake --build build/x64 --target mat_alarm_tests && cd build/x64 && ctest --output-on-failure -R Alarm
  # The same tests with AddressSanitizer and UndefinedBehaviorSanitizer (feature 006 T207): the parsers of
  # the wire, the driver threads and the serial port. The fuzz runs 20 s here; the one-hour run is
  # tools/fuzz-modbus.ps1 -Seconds 3600, by hand (SC-020).
  sanitize-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++
      # the large package vectors are not committed (tests/package-vectors/.gitignore)
      - run: node tests/package-vectors/generate.mjs --out
      - run: node tools/release/make-update.mjs --vectors --out --test
      - run: >
          cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          && cmake --build build/asan
      - run: cd build/asan && ASAN_OPTIONS=detect_leaks=0 MAT_FUZZ_SECONDS=20 ctest --output-on-failure
  tools-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/load-tester/go.mod
          cache-dependency-path: tools/load-tester/go.sum
      - run: cd tools/load-tester && test -z "$(gofmt -l .)" && go vet ./... && go test -count=1 ./...
        if: hashFiles('tools/load-tester/go.mod') != ''
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Feature 011 (T056, T059): dependency audit of what ships (Critical/High fail; the full tree in tools/ci-local.ps1)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:project
      - run: npm test
      # Feature 009 (T122): vectors v05-* and alarm-widget rules, the alarm-engine package, lint of hard-coded strings of the alarm UI
      - run: npx vitest run packages/project-schema/src/vectors-05.test.ts packages/project-schema/src/alarm-widget-rules.test.ts
      - run: npm test -w @mat/alarm-engine
      - run: node --test tools/lint-rules-alarm.test.mjs
      - run: node --test "tools/modbus-sim/*.test.mjs" "tools/s7-sim/*.test.mjs" "tools/fins-sim/*.test.mjs" "tools/mc-sim/*.test.mjs" "tools/bacnet-sim/*.test.mjs" "tools/project-validator/*.test.mjs" "tools/dashboard-demo/*.test.mjs" "tools/gen-widget-docs.test.mjs" "tools/gen-error-codes.test.mjs"
      # Feature 011 (T177, T059): links, file references, CLI flags and error codes of the Markdown docs
      - run: node --test tools/docs-check.test.mjs tools/build-docs.test.mjs && node tools/docs-check.mjs
      # Pilot (feature 011, T187 to T189): KPI on the sample set tests/pilot-kpi; collect.ps1 against a fake API (pwsh is on the runner)
      - run: node --test "tools/pilot/*.test.mjs"
      # SVG import (feature 008, T050): the CLI imports the 10 acceptance fixtures; the CLI tests
      - run: npm run svg:inspect -- --import tests/fixtures/svg-import
      - run: node --test "tools/svg-import/*.test.mjs"
      # Importer fuzz (T113): 10,000 deterministic cases in <= 3 minutes
      - run: node tools/svg-import/fuzz.mjs --cases 10000
      # Vitest of svg-import, symbol-library and svg-renderer runs inside `npm test` (all workspaces); ctest of
      # rules_04 and vectors_04 runs in test-x64. The malicious set, anim-bench and the long fuzz are
      # `tools/ci-local.ps1 -Full` (feature 008, T119): Chrome, 20+ minutes.
      - run: npm run build:web
      # Studio UI on headless Chrome (preinstalled on the runner) with the fake Tauri layer + axe-core
      - run: npm run e2e -w @mat/studio
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # All *.e2e.mjs of the Studio run (008: import, svg-bind, svg-perf, symbols, rebuild-tank, reimport, upgrade04)
      # Operator page (feature 007, T040, T074; 008: svg-events, svg-unsafe, anim) on headless Chrome with a fake runtime
      - run: npm run e2e -w @mat/runtime-web
        env:
          CHROME_PATH: /usr/bin/google-chrome
  # Driver scenarios of feature 006 on x64 runtimes with the Node simulator (tools/driver-it.ps1): the fast
  # ones. By hand, with the reasons: unplug (a real network cut, -Net, needs docker network disconnect),
  # load (60 s and ten clients: a measurement, not a check), write-kill (random kill -9, minutes), retain (20
  # rounds of waiting out the window of the store and kill -9: about 4 minutes), the fuzz of one hour.
  driver-it:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: pwsh tools/driver-it.ps1 -Scenario source,read,merge,split,probe,write,write-race,calc,faults -Seconds 30 -BuildDir "$PWD/build-drv"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-it-reports
          path: docs/reports/006-*-x64.json
  # Operator page and web login of feature 007 on x64 runtimes (tools/web-it.ps1): sessions, 30 attack cases,
  # control, locks, pulse, expect, certificates, gate, and the page on a real Chrome (screens, widgets, F5 x 10, open).
  # By hand, with the reasons: pulse-kill (kill -9, minutes), the 30 minute load and charts runs (T136, SC-004).
  web-it:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: pwsh tools/web-it.ps1 -Scenario bundle,control,locks,expect,pulse,session,attack,gate,attack-accounts,session28,cert,compat,screens,widgets,chrome-control,f5x10,open -Rounds 10 -BuildDir "$PWD/build-web-it"
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-it-reports
          path: docs/reports/007-*-x64.json
  # Device scenarios on x64 runtimes (feature 005, tools/device-it.ps1): Docker networks with
  # broadcast, deploy, packages, busy, health (the runtime is built with MAT_TEST_HOOKS in Docker).
  # kill (long) and reload (Chrome tabs, ports on 127.0.0.1) run by hand with tools/device-it.ps1.
  device-it:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: pwsh tools/device-it.ps1 -Scenario auth,discovery,packages,deploy,busy,health -BuildDir "$PWD/build-it"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-it-reports
          path: docs/reports/005-*-x64.json
  # Alarms of feature 009 on x64 runtimes (tools/alarm-it.ps1): the subset that runs in CI. By hand, with the reasons: killloop
  # (kill -9 in a loop, minutes), storm, latency and budget (measurements, not checks).
  alarm-it:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: pwsh tools/alarm-it.ps1 -Scenario state,quality,restart,auth,attack,compat,history -BuildDir "$PWD/build-alarm-it"
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alarm-it-reports
          path: docs/reports/009-*-x64.json
  # Feature 011 (T055, T059): SAST of core/, server/, drivers/ with cppcheck in the toolchain image (about 10 s);
  # clang-tidy (1-2 h) runs in tools/ci-local.ps1 -Full.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mat-armhf deployment/toolchain
      - run: pwsh tools/sast/run.ps1 -Tool cppcheck -NoImageBuild -BuildDir "$PWD/build-sast"
  # OTA of feature 011 on x64 (tools/update-it.ps1, T120): the fast subset. By hand: ok (20 updates), kill (40 kill -9 points).
  update-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: docker build -t mat-armhf deployment/toolchain
      - run: pwsh tools/update-it.ps1 -Scenario bad,downgrade,busy,keyset,auth,health -BuildDir "$PWD/build-update-it"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-it-reports
          path: docs/reports/011-update-x64.json
  # Logic v2 of feature 011 on x64 with the Modbus simulator (tools/logic-it.ps1, T146): the fast scenarios. By hand:
  # retain-kill (100 rounds of kill -9, about 40 minutes), load (a measurement, T147).
  logic-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: docker build -t mat-armhf deployment/toolchain
      - run: pwsh tools/logic-it.ps1 -Scenario rules,writes-off,throttle,stop,retain-lost,deploy-keep -BuildDir "$PWD/build-logic-it"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-it-reports
          path: docs/reports/011-logic-x64.json
