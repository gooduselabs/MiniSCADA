<?xml version="1.0"?>
<!--
  cppcheck library of mAT SCADA (specs/011-pilot-hardening T055, FR-028): the vendored C APIs that the
  runtime calls and that the stock libraries (std, posix, sqlite3) do not describe. Loaded by
  tools/sast/run.ps1 with  -library=std -library=posix -library=sqlite3 -library=<this file>.
  Only facts of the API go here (arguments that must not be null, results that must be used, format
  strings); never a way to hide a finding: those go in tools/sast/suppressions.txt with a reason.
-->
<def format="2">
  <!-- CivetWeb 1.16 (third_party/civetweb) -->
  <function name="mg_printf">
    <noreturn>false</noreturn>
    <formatstr/>
    <arg nr="1"><not-null/><not-uninit/></arg>
    <arg nr="2"><formatstr/><not-null/><not-uninit/></arg>
  </function>
  <function name="mg_write">
    <noreturn>false</noreturn>
    <arg nr="1"><not-null/><not-uninit/></arg>
    <arg nr="2"><not-null/><not-uninit/></arg>
    <arg nr="3"><not-uninit/><valid>0:</valid></arg>
  </function>
  <function name="mg_read">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1"><not-null/><not-uninit/></arg>
    <arg nr="2"><not-null/></arg>
    <arg nr="3"><not-uninit/><valid>0:</valid></arg>
  </function>
  <function name="mg_get_header">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1"><not-null/><not-uninit/></arg>
    <arg nr="2"><not-null/><not-uninit/><strz/></arg>
  </function>
  <function name="mg_get_request_info">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1"><not-null/><not-uninit/></arg>
  </function>
  <function name="mg_get_user_data,mg_get_user_connection_data">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1"><not-uninit/></arg>
  </function>
  <!-- Mbed TLS 3.6 (third_party/mbedtls): wiping a key buffer -->
  <function name="mbedtls_platform_zeroize">
    <noreturn>false</noreturn>
    <arg nr="1"><not-null/></arg>
    <arg nr="2"><not-uninit/><valid>0:</valid></arg>
  </function>
  <function name="mbedtls_pk_init,mbedtls_x509write_crt_init,mbedtls_x509write_csr_init">
    <noreturn>false</noreturn>
    <arg nr="1"><not-null/></arg>
  </function>
</def>
