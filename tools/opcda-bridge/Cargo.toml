[package]
name = "mat-opcda-bridge"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "mAT OPC DA Bridge: OPC DA client (local COM) exposed as a Modbus TCP server"
publish = false

[[bin]]
name = "mat-opcda-bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Services",
  "Win32_Security",
] }
windows-core = "0.62"

[profile.release]
opt-level = 2
lto = true
strip = true
